name: Tests
on: [push, pull_request]
jobs:
  offline-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[live]"
      - run: python -m playwright install --with-deps chromium
        if: runner.os == 'Linux'
      - run: python -m playwright install chromium
        if: runner.os == 'Windows'
      - run: python -m unittest discover -v
        env:
          ROC_BROWSER_TESTS: '1'
      - run: python -m roc run examples/demo.json
      - run: python -m roc plan examples/district-validation.json
      - run: python -m roc validate-courts examples/court-batch.json
      - run: python -m pip wheel --no-deps . --wheel-dir dist
      - name: Verify packaged court registry
        run: |
          python -I -c 'from pathlib import Path; import sys; sys.path.insert(0, str(next(Path("dist").glob("*.whl")).resolve())); from roc.courts import registry_summary; assert registry_summary()["registeredDistrictCourts"] == 94'
          python -I -c 'from pathlib import Path; from importlib.resources import files; import sys; sys.path.insert(0, str(next(Path("dist").glob("*.whl")).resolve())); assert all(files("roc").joinpath("ui", name).is_file() for name in ("index.html", "app.js", "documents.js", "style.css", "demo-index.json", "demo-docket.html"))'
